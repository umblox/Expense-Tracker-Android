name: Android CI Build

on:
  workflow_dispatch: # Agar bisa klik tombol "Run" manual dari web GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Setup Environment Files
      run: |
        mkdir -p app
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
        echo 'GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"' >> local.properties
        echo '${{ secrets.FIREBASE_JSON }}' > app/google-services.json

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Expense-Tracker-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
